services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    network_mode: host
    command: ["postgres", "-p", "55437", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: recruitment_local
    volumes:
      - recruitment_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 55437 -U recruitment -d recruitment"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: docker.io/library/redis:7-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "56379", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - recruitment_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "56379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: docker.io/axllent/mailpit:v1
    network_mode: host
    environment:
      MP_SMTP_BIND_ADDR: "127.0.0.1:51025"
      MP_UI_BIND_ADDR: "127.0.0.1:58025"
volumes:
  recruitment_postgres:
  recruitment_redis:
