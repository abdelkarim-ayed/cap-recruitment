name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      # Integration tests require a live PostgreSQL + Redis + demo seed.
      # They are Q-gated evidence (see docs/current/status.md) and are not
      # runnable in a stock GitHub Actions runner. Skip them here; run locally
      # with DATABASE_URL/REDIS_URL set.
      - name: Integration tests
        if: env.DATABASE_URL != ''
        run: pnpm test
