position: Jefatura de equipos y coordinación de proyectos
tagline: "Jefa de equipo con experiencia en operaciones de servicio y coordinación de mejoras. Ha asumido responsabilidades de planificación, seguimiento y apoyo a equipos que trabajan por turnos. En los últimos años se ha acercado más a la entrega de proyectos, organizando tareas y dependencias sin perder de vista el trabajo diario."
objective: "Busco seguir proyectos de principio a fin y aportar experiencia práctica liderando equipos operativos."

